name = "cheap_daily"
description = "Cheap-daily mix config. Do not spawn. Astra reads luna and deepseek weights per 10 assignments."
model = "deepseek-v4-flash"
model_reasoning_effort = "high"
sandbox_mode = "read-only"

# luna : deepseek, counted per 10 cheap-daily assignments.
# Example 4:6 → 4× luna_worker, 6× deepseek_flash_worker
# 10:0 → only Luna; 0:10 → only DeepSeek
# Default 0:10: many relay/gateway sites have blocked gpt-5.6-luna.
luna = 0
deepseek = 10

developer_instructions = """
This file is mix configuration, not a worker. Do not implement packets.

Astra reads `.codex/agents/cheap-daily.toml` (luna and deepseek integer weights) before assigning cheap-daily packets. If spawned by mistake, return immediately and tell Astra to assign luna_worker or deepseek_flash_worker using those weights.
"""
